# Compila el core de MiSTer en GitHub con Quartus 17.0 (imagen Docker
# raetro/quartus:17.0, la version que usa MiSTer) y deja como resultado el .rbf
# y los informes. Al subir una etiqueta v* (por ejemplo v1.0) crea ademas una
# Release con el .rbf.
#
# - push / pull request: compila y sube el resultado (pestana Actions).
# - push a main: ademas deja el .rbf en releases/FP1100_AAAAMMDD.rbf con un commit
#   (los cambios solo en releases/ no relanzan la compilacion).
# - Lanzar a mano: Actions > Build > Run workflow.
# - Release: git tag v1.0 && git push origin v1.0

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'releases/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'releases/**'
  workflow_dispatch:

permissions:
  contents: write          # para crear la Release en las etiquetas v*

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      # La imagen de Quartus ocupa unos 6 GB comprimida: se libera sitio en la
      # maquina de GitHub antes de descargarla.
      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      # el core es un submodulo (rtl/fp1100)
      - name: Descargar el repositorio con los submodulos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Descargar Quartus 17.0
        run: docker pull raetro/quartus:17.0

      # Compilacion completa: sys/build_id.tcl (build_id.v),
      # sintesis, ajuste, ensamblado y tiempos
      - name: Compilar
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/build -w /build raetro/quartus:17.0 \
            quartus_sh --flow compile FP1100

      - name: Detalle de tiempos de la SDRAM
        if: always()
        run: |
          if [ -f output_files/FP1100.sta.rpt ]; then
            docker run --rm -v "$GITHUB_WORKSPACE":/build -w /build raetro/quartus:17.0 \
              quartus_sta -t tools/rutas_sdram.tcl
          fi

      # Resumen de tiempos en la pagina de la ejecucion; aviso si alguna
      # holgura es negativa (no para la compilacion: el .rbf sale igual)
      - name: Resumen de tiempos
        if: always()
        run: |
          STA=output_files/FP1100.sta.rpt
          [ -f "$STA" ] || { echo "No hay informe de tiempos" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          {
            echo "## Tiempos (modelo lento)"
            echo '```'
            for s in "Setup Summary" "Hold Summary" "Recovery Summary" "Removal Summary"; do
              echo "== $s"
              sed -n "/; $s/,/^$/p" "$STA" | grep '^; [^C-]' | grep -v 'Clock *;' | cut -c1-110
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if sed -n '/Setup Summary/,/Removal Summary/p' "$STA" | grep -qE ';[[:space:]]*-[0-9]+\.[0-9]+[[:space:]]*;'; then
            echo "::warning title=Tiempos::Hay holguras negativas: revisa FP1100.sta.rpt y rutas_sdram.txt"
          fi

      - name: Preparar el resultado
        if: always()
        run: |
          mkdir -p dist
          DATE=$(date -u +%Y%m%d)
          [ -f output_files/FP1100.rbf ] && cp output_files/FP1100.rbf "dist/FP1100_${DATE}.rbf"
          for r in map fit sta flow asm; do
            [ -f output_files/FP1100.$r.rpt ] && cp output_files/FP1100.$r.rpt dist/
          done
          [ -f output_files/rutas_sdram.txt ] && cp output_files/rutas_sdram.txt dist/
          ls -la dist

      - name: Subir el resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FP1100-${{ github.sha }}
          path: dist/
          retention-days: 30

      # En cada push a main el .rbf nuevo va a releases/ (como en los cores de MiSTer-devel).
      # El commit va a nombre del autor del repo; los push hechos con GITHUB_TOKEN no lanzan
      # otra vez el workflow, y ademas releases/ esta en paths-ignore.
      - name: Guardar el .rbf en releases/
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          RBF=$(ls dist/FP1100_*.rbf 2>/dev/null | head -1)
          [ -n "$RBF" ] || { echo "No hay .rbf"; exit 1; }
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          git config user.name  "Shaeon (Carlos Palmero)"
          git config user.email "shaeon@users.noreply.github.com"
          mkdir -p releases
          cp "$RBF" releases/
          git add releases/
          if git diff --cached --quiet; then
            echo "El .rbf no ha cambiado"
            exit 0
          fi
          git commit -m "releases: $(basename "$RBF")"
          # Quartus reescribe ficheros del repo (el .qsf, por ejemplo): --autostash los aparta
          # durante el rebase para que no lo bloqueen
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

      - name: Crear la Release (etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FP1100_*.rbf
          generate_release_notes: true
